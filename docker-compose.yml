# Environnement de développement 100% local et gratuit (section 40 du cahier des charges).
# Aucun service payant n'est nécessaire pour faire tourner ce docker-compose.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Pas de "ports" ici : le backend accède à Postgres via le réseau Docker
    # interne (nom de service "postgres"), pas besoin de l'exposer à l'extérieur.
    # C'est aussi plus sûr : une base de données ne doit jamais être ouverte sur internet.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    # Idem : pas d'exposition publique nécessaire pour Celery/le backend.

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      TELEPHONY_PROVIDER: mock
      VOICE_PROVIDER: mock
      MESSAGING_PROVIDER: mock
      KYC_PROVIDER: manual_review
    ports:
      # 8001 côté serveur (le port 8000 est déjà utilisé par un autre service
      # sur ce serveur) -> 8000 côté conteneur (inchangé, pas besoin d'y toucher).
      - "8001:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        # Lu depuis le fichier .env à la racine du projet (voir .env.example).
        # Doit pointer vers l'adresse PUBLIQUE du serveur (pas "backend" ni
        # "localhost"), car cet appel part du navigateur de l'utilisateur.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
