# Environnement de développement 100% local et gratuit (section 40 du cahier des charges).
# Aucun service payant n'est nécessaire pour faire tourner ce docker-compose.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Pas de "ports" ici : le backend accède à Postgres via le réseau Docker
    # interne (nom de service "postgres"), pas besoin de l'exposer à l'extérieur.
    # C'est aussi plus sûr : une base de données ne doit jamais être ouverte sur internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    # Idem : pas d'exposition publique nécessaire pour Celery/le backend.

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-mock}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-mock}
      MESSAGING_PROVIDER: mock
      KYC_PROVIDER: manual_review
      # --- Identifiants des fournisseurs réels (section 16) ---
      # Tant que TELEPHONY_PROVIDER et VOICE_PROVIDER valent "mock" (valeur
      # par défaut ci-dessus), aucun appel réel n'est jamais déclenché, même
      # si les clés ci-dessous sont renseignées. Pour activer Retell/Twilio :
      # dans le fichier .env, ajoutez VOICE_PROVIDER=retell et/ou
      # TELEPHONY_PROVIDER=twilio, EN PLUS des clés correspondantes.
      RETELL_API_KEY: ${RETELL_API_KEY:-}
      RETELL_AGENT_ID: ${RETELL_AGENT_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    ports:
      # 8010 côté serveur (8000 et 8001 sont déjà pris par d'autres projets
      # sur ce serveur) -> 8000 côté conteneur (inchangé).
      - "8010:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        # Lu depuis le fichier .env à la racine du projet (voir .env.example).
        # Doit pointer vers l'adresse PUBLIQUE du serveur (pas "backend" ni
        # "localhost"), car cet appel part du navigateur de l'utilisateur.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    ports:
      # 3010 côté serveur (3000/3001/3002 déjà pris par d'autres projets).
      - "3010:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
